<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mens Fashion Store</title>
    <link rel="stylesheet" href="Front_end\static\StyleCart.css">
</head>

<body>
    {{template "logo.html"}}

    {{template "menu-bar.html"}}

    <div class="container">
        <div class="cart">
            <table>
                <thead>
                    <tr>
                        <th>Product</th>
                        <th>Price</th>
                        <th>Quantity</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody>
                    {{ range .cart.Items }}
                    <tr>
                        <td>{{ .Product.Name }}</td>
                        <td>${{ .Product.Price }}</td>
                        <td>{{ .Quantity }}</td>
                        <td style="display: flex; justify-content: space-between;">
                            <form action="/cart/add/{{ .Product.ProductID }}" method="post">
                                <button type="submit">+</button>
                            </form>
                        
                            <form action="/cart/subtract/{{ .Product.ProductID }}" method="post">
                                <button type="submit">-</button>
                            </form>
                        
                            <form action="/cart/remove/{{ .Product.ProductID }}" method="post">
                                <button type="submit">Remove</button>
                            </form>
                        
                    </tr>
                    {{ end }}
                </tbody>
            </table>
        </div>
        <div class="total">
            <p>Total: ${{ .cart.Total }}</p>
        </div>
        <form action="/cart/deleteall" method="post">
            <button type="submit">Remove All Items</button>
        </form>
    </div>
</body>

</html>
